# --- General ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
set -g focus-events on

# --- Prefix (Space leader, like vim) ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Splits (vim-style) ---
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane navigation (C-w + hjkl, like vim windows) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane resizing (vim :resize feel) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Window nav (like vim buffers) ---
bind c new-window -c "#{pane_current_path}"   # new window in this session, same dir
bind n next-window        # :bn
bind p previous-window    # :bp
bind x confirm-before -p "kill pane? (y/n)" kill-pane       # :q
bind X confirm-before -p "kill window? (y/n)" kill-window   # :bd
bind w choose-window      # :ls / buffer list

# --- Copy mode (full vi mode) ---
setw -g mode-keys vi
bind Escape copy-mode                                    # Esc enters copy mode
bind -T copy-mode-vi v send -X begin-selection           # visual select
bind -T copy-mode-vi V send -X select-line               # visual line
bind -T copy-mode-vi C-v send -X rectangle-toggle        # visual block
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel               # Esc exits copy mode

# --- Command prompt (: like vim) ---
bind : command-prompt

# --- Reload (like :source) ---
bind r source-file ~/.config/tmux/tmux.conf \; display "sourced."

# --- Sessions ---
# S: fzf session picker in a popup; falls back to the built-in tree if fzf is missing
bind S if-shell 'command -v fzf || test -x /opt/homebrew/bin/fzf' \
  'display-popup -E -B -w 80% -h 70% "~/.config/tmux/scripts/session-picker"' \
  'choose-tree -Zs'
bind N command-prompt -p "New session:" "new-session -s '%%'"

# --- Status bar (minimal, vim statusline vibe) ---
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#565f89"
set -g status-left "#[fg=#7aa2f7,bold] #S #[default]│ #{?client_prefix,#[fg=#1a1b26#,bg=#e0af68#,bold] PREFIX #[default]│ ,}#{?pane_in_mode,#[fg=#1a1b26#,bg=#9ece6a#,bold] #{s/-mode//:pane_mode} #[default]│ ,}"
set -g status-right "#[fg=#565f89]%H:%M"
set -g status-left-length 60
# window label = pane title (e.g. the Claude task, with its activity spinner),
# falling back to the window name when nothing set a title; max 20 chars
%hidden WTITLE="#{=/20/…:#{?#{==:#{pane_title},#{host}},#{window_name},#{pane_title}}}"
setw -g window-status-format "#[fg=#565f89] #I:${WTITLE} "
setw -g window-status-current-format "#[fg=#c0caf5,bold] #I:${WTITLE} "
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#1a1b26,fg=#c0caf5"
